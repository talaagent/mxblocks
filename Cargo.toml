[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/talaagent/mxblocks"

[workspace.dependencies]
mxblocks = { path = "crates/mxblocks", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tempfile = "3"
tokio = { version = "1", default-features = false }
