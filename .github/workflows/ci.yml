name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo test --doc --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo publish --workspace --dry-run --locked

  packages:
    name: pnpm and Turbo packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: cachix/install-nix-action@v31
      - run: pnpm install --frozen-lockfile
      # Supplies the pinned resvg/fonts needed by the uncached math tests.
      - run: nix develop --command pnpm check
      - run: pnpm artifacts
      - run: nix develop --command python3 scripts/test-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: mxblocks-packages-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  privacy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          PRIVATE_PATTERNS: ${{ secrets.MXBLOCKS_PRIVATE_PATTERNS }}
        run: |
          if [ -n "$PRIVATE_PATTERNS" ]; then
            f="$(mktemp)"
            printf '%s\n' "$PRIVATE_PATTERNS" > "$f"
            export MXBLOCKS_PRIVATE_PATTERNS="$f"
          fi
          scripts/privacy-check

  nix-flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix run nixpkgs#actionlint
