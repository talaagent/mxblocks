name: npm release

on:
  push:
    branches: [main]
    paths:
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - scripts/package-artifacts
      - .github/workflows/npm-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - uses: cachix/install-nix-action@v31
      # npm >=11.5.1 supports trusted publishing; pnpm builds/packs the workspace.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: nix develop --command pnpm check
      - run: pnpm artifacts
      - run: nix develop --command python3 scripts/test-artifacts
      - name: Publish new versions
        shell: bash
        run: |
          for package in element math; do
            manifest="packages/mxblocks-$package/package.json"
            name=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).name' "$manifest")
            version=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1])).version' "$manifest")
            # Only a genuine 404 means unpublished. Network/auth errors must fail.
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/registry.json" --write-out '%{http_code}' "https://registry.npmjs.org/$name/$version")
            if [ "$status" = 200 ]; then
              echo "$name@$version already published"
            elif [ "$status" = 404 ]; then
              npm publish "artifacts/talaagent-mxblocks-$package-$version.tgz" --access public --provenance
            else
              echo "::error::Registry lookup failed for $name@$version: HTTP $status"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: mxblocks-npm-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
      - name: Attach deployment assets to the npm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          element=$(node -p 'JSON.parse(require("fs").readFileSync("packages/mxblocks-element/package.json")).version')
          math=$(node -p 'JSON.parse(require("fs").readFileSync("packages/mxblocks-math/package.json")).version')
          tag="npm-element-$element-math-$math"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "npm packages: Element $element, math $math" --notes "Public npm packages and deployment assets. See docs/integration.md for installation."
          fi
          gh release upload "$tag" artifacts/* --clobber
