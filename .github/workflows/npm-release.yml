# Changesets: pending .changeset/*.md files on main open or update a
# "Version Packages" PR. Merging it (no changesets left) publishes every public
# package version that is not on npm yet, through npm trusted publishing (OIDC).
name: npm release

on:
  push:
    branches: [main]
    paths:
      - .changeset/**
      - packages/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - package.json
      - scripts/package-artifacts
      - scripts/publish-packages
      - scripts/test-artifacts
      - .github/workflows/npm-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ !github.event.repository.private && vars.NPM_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      # Dispatches CI on the version PR (PRs opened by GITHUB_TOKEN start no workflows).
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - uses: cachix/install-nix-action@v31
      # npm >=11.5.1 supports trusted publishing; pnpm builds/packs the workspace.
      - run: npm install --global npm@latest
      - run: pnpm install --frozen-lockfile
      - run: nix develop --command pnpm check
      - run: pnpm artifacts
      - run: nix develop --command python3 scripts/test-artifacts
      - name: Version PR or publish
        id: changesets
        uses: changesets/action@v2
        with:
          # Publishes the archives tested above with `npm publish --provenance`,
          # then tags them; the action pushes the tags and creates releases.
          publish-script: python3 scripts/publish-packages
      - uses: actions/upload-artifact@v7
        with:
          name: mxblocks-npm-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
      - name: Attach deployment assets to the release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: |
          for tag in $(jq -r '.[] | select(.name == "@talaagent/mxblocks-element") | "\(.name)@\(.version)"' <<<"$PUBLISHED"); do
            # The action only creates a release when the package CHANGELOG has an entry.
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --verify-tag --title "$tag" --notes "npm package and Element deployment assets. See docs/integration.md for installation."
            fi
            gh release upload "$tag" artifacts/* --clobber
          done
      - name: Start CI for the version PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: changeset-release/${{ github.ref_name }}
        run: gh workflow run ci.yml --ref "$BRANCH"
